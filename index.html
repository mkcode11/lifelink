  function mapSvg(mode='overview') { const incident=mode==='sos'||mode==='routing'||mode==='dispatch'; return `<div class="map"><div class="map-label"><span class="pulse"></span> ${mode==='routing'?'Route corridor simulation':'Demo geospatial view'}</div><svg viewBox="0 0 720 310" role="img" aria-label="Illustrated demo map with simulated streets, responder and hospital markers" preserveAspectRatio="xMidYMid slice">

    <g><circle cx="500" cy="92" r="17" fill="#22d3a6" opacity=".12"/><circle cx="500" cy="92" r="8" fill="#22d3a6" stroke="#c4ffed" stroke-width="2"/><text x="516" y="88" fill="#a5f7df" font-size="10" font-weight="700">HOSPITAL</text><text x="516" y="101" fill="#7895a6" font-size="8">Receiving facility</text></g>

  function overviewView() {
    const rows=state.incidents.slice(0,3).map((it,i)=>`<div class="dispatch-row"><div class="dispatch-icon">${i===0?'⚑':i===1?'♡':'＋'}</div><div class="dispatch-copy"><strong>${escapeHTML(it.type)}</strong><span>${escapeHTML(it.id)} · ${escapeHTML(it.location)}</span></div><div class="dispatch-meta"><strong>${escapeHTML(it.eta)}</strong><span>${escapeHTML(it.status)}</span></div></div>`).join('');

  function sosView() {

an></div><div style="font-size:10px;color:var(--muted)">${state.location.source==='browser'?'Coordinates were read by your browser and stay in this page.':`Example coordinates: ${state.location.lat.toFixed(4)}° N, ${state.location.lng.toFixed(4)}° E.`}</div><div class="form-actions"><button type="button" class="btn blue" data-action="get-location">⌖ Use browser location</button><button type="button" class="btn ghost" data-action="reset-location">Use example location</button></div></div><div class="form-actions"><button type="submit" class="btn primary" id="run-sos">⚑ Run demo SOS flow</button><span class="hint" style="align-self:center">Runs a local scenario; no backend is attached.</span></div></form></section>

e="width:37.6%;background:linear-gradient(90deg,#168a80,#36dbb0)"></div></div><strong class="route-time text-green">3.2 min</strong></div></div><div class="panel" style="margin-top:24px;background:#0a1420;box-shadow:none"><div class="kicker">Routing telemetry</div><div class="capacity-row" style="margin-top:14px"><span>Traffic dispersion index</span><b>0.18</b></div><div class="progress"><span style="width:18%;background:var(--amber)"></span></div><div class="capacity-row" style="margin-top:14px"><span>Route model match success</span><b>${reportMetrics.routing}</b></div><div class="progress"><span style="width:98.7%;background:var(--green)"></span></div><p class="inline-note">No real routes are calculated. A production implementation would require road graph data and properly configured mapping APIs.</p></div><div class="form-actions"><button class="btn green" data-action="go-dispatch">Continue to dispatch →</button></div></section></div>`;

  function dispatchView() {
    const rows=state.units.map(u=>`<tr><td><strong>${escapeHTML(u.id)}</strong><div class="muted" style="font-size:9px;margin-top:3px">${escapeHTML(u.type)}</div></td><td>${escapeHTML(u.crew)}</td><td>${u.distance}</td><td>${u.eta}</td><td><span class="status ${unitStatusClass(u.status)}">${escapeHTML(u.status)}</span></td><td><button class="btn small ${u.status==='Available'?'green':'ghost'}" data-action="assign-unit" data-unit="${escapeHTML(u.id)}" ${u.status!=='Available'?'disabled':''}>${u.status==='Available'?'Assign demo':'Unavailable'}</button></td></tr>`).join('');
    return `${head('MODULE 03 / FLEET COORDINATION','Ambulance dispatch console','Match incident severity, responder capability and estimated travel time. All listed vehicles are fictional demo entries.',`<button class="btn" data-action="refresh-units">↻ Refresh demo fleet</button>`)}${alertBox()}<div class="metric-grid">${metric('Demo active fleet','42','✚','Example fleet count shown in report','green')}${metric('ALS / BLS units in view','4','▣','Sample units below','blue')}${metric('Dispatch lock target','<2.0s','⌁','Non-functional requirement in report','amber')}${metric('Dispatch match success',reportMetrics.dispatch,'✓','Report-reported simulation','purple')}</div><section class="panel" style="margin-bottom:16px"><div class="panel-head"><div><h2 class="panel-title">Responder availability</h2><p class="panel-sub">Sample units within an illustrative 5 km search radius</p></div><span class="tag green">Local demo state</span></div><div class="table-wrap"><table><thead><tr><th>Unit / type</th><th>Crew</th><th>Distance</th><th>Estimated time</th><th>Status</th><th>Action</th></tr></thead><tbody id="unit-table">${rows}</tbody></table></div><div class="inline-note">Selecting “Assign demo” changes the local UI only. It does not contact or reserve a real ambulance.</div></section><div class="two-col"><section class="panel"><div class="panel-head"><div><h2 class="panel-title">Dispatch decision factors</h2><p class="panel-sub">Selection model outlined in the report</p></div></div><div class="capacity-row"><span>ETA component</span><b>60%</b></div><div class="progress"><span style="width:60%;background:var(--blue)"></span></div><div class="capacity-row" style="margin-top:13px"><span>Equipment compatibility</span><b>25%</b></div><div class="progress"><span style="width:25%;background:var(--green)"></span></div><div class="capacity-row" style="margin-top:13px"><span>Paramedic capability</span><b>15%</b></div><div class="progress"><span style="width:15%;background:var(--purple)"></span></div><p class="inline-note">Weights are illustrative documentation. This page does not execute the production scoring algorithm or atomic database locks.</p></section><section class="panel"><div class="panel-head"><div><h2 class="panel-title">Current dispatch audit</h2><p class="panel-sub">Latest locally simulated incident</p></div><span class="tag blue">Browser state</span></div><div id="dispatch-audit">${dispatchAudit()}</div></section></div>`;
  }
  function dispatchAudit() { const it=state.currentIncident || state.incidents[0]; return `<div class="incident-banner"><div><strong>${escapeHTML(it.id)} · ${escapeHTML(it.type)}</strong><small>${escapeHTML(it.status)} · ${escapeHTML(it.location)}</small></div><span class="status enroute">Demo audit</span></div><div class="route-summary"><div class="mini-stat"><span>Responder</span><strong style="font-size:13px">${escapeHTML(it.unit||'Not assigned')}</strong><small>Sample vehicle ID</small></div><div class="mini-stat"><span>ETA</span><strong>${escapeHTML(it.eta||'—')}</strong><small>Simulated value</small></div><div class="mini-stat"><span>Hospital</span><strong style="font-size:12px">${escapeHTML(it.hospital||'Pending')}</strong><small>Sample match</small></div></div>`; }
  function hospitalView() {
    const cards=state.hospitals.map((h,i)=>`<article class="hospital-card"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><h3>${escapeHTML(h.name)}</h3><p>${escapeHTML(h.area)}</p></div><span class="tag ${i===0?'green':i===1?'blue':'red'}">${escapeHTML(h.status)}</span></div><div class="capacity-row"><span>Available ICU beds</span><b>${h.icu} / ${h.icuTotal}</b></div><div class="progress"><span style="width:${h.icu/h.icuTotal*100}%;background:${h.icu>1?'var(--green)':'var(--red)'}"></span></div><div class="capacity-row"><span>Ventilators</span><b>${h.ventilators} / ${h.ventTotal}</b></div><div class="progress"><span style="width:${h.ventilators/h.ventTotal*100}%;background:var(--blue)"></span></div><div class="hospital-score"><div><strong>${h.score.toFixed(1)}%</strong><div><small>Demo match score</small></div></div><button class="btn small ${i===0?'green':'ghost'}" data-action="reserve-bed" data-hospital="${i}">Reserve demo</button></div></article>`).join('');
    return `${head('MODULE 04 / HOSPITAL MATCHING','Capacity-aware hospital & triage','Explore sample receiving-facility inventory and a non-clinical triage UI inspired by the report’s ESI workflow.',`<button class="btn" data-action="reset-hospitals">↻ Reset sample inventory</button>`)}${alertBox()}<div class="triage-banner"><div class="triage-mark">!</div><div><strong>Not a medical decision tool</strong><p>ESI labels and first-aid cards below are for UI demonstration only. They cannot assess a real patient. Call emergency services and follow qualified dispatcher or clinician instructions.</p></div></div><div class="panel" style="margin-bottom:16px"><div class="panel-head"><div><h2 class="panel-title">Hospital bed & resource matcher</h2><p class="panel-sub">Inventory is fictional and can be changed by the demo controls</p></div><span class="tag">Pandas-inspired table</span></div><div class="table-wrap"><table><thead><tr><th>Receiving facility</th><th>ICU beds</th><th>Ventilators</th><th>Blood inventory</th><th>Match score</th><th>Availability</th></tr></thead><tbody>${state.hospitals.map(h=>`<tr><td><strong>${escapeHTML(h.name)}</strong><div class="muted" style="font-size:9px;margin-top:3px">${escapeHTML(h.area)}</div></td><td>${h.icu} / ${h.icuTotal}</td><td>${h.ventilators} / ${h.ventTotal}</td><td>${escapeHTML(h.blood)}</td><td><strong class="${h.score>90?'text-green':'text-amber'}">${h.score.toFixed(1)}%</strong></td><td><span class="status ${h.icu>1?'available':'warning'}">${h.icu>1?'Capacity shown':'Limited demo stock'}</span></td></tr>`).join('')}</tbody></table></div></div><div class="two-col"><section class="panel"><div class="panel-head"><div><h2 class="panel-title">Triage workflow preview</h2><p class="panel-sub">Select a demo category to see a non-clinical interface state</p></div><span class="tag red">Not diagnostic</span></div><div class="field"><label for="triage-category">Demo incident category</label><select id="triage-category"><option value="trauma">Road trauma</option><option value="cardiac">Cardiac event</option><option value="respiratory">Breathing concern</option><option value="fall">Fall / injury</option><option value="other">Other</option></select></div><div class="field" style="margin-top:12px"><label for="triage-level">Example workflow label (not a medical recommendation)</label><select id="triage-level"><option>ESI Level 1 — critical (example label)</option><option>ESI Level 2 — high acuity (example label)</option><option>ESI Level 3 — moderate (example label)</option><option>ESI Level 4 — lower acuity (example label)</option><option>ESI Level 5 — low acuity (example label)</option></select></div><button class="btn blue" style="margin-top:14px" data-action="preview-triage">Preview demo state</button><div id="triage-preview" class="inline-note">No patient information is required. This only demonstrates the UI.</div></section><section class="panel"><div class="panel-head"><div><h2 class="panel-title">Pre-arrival guidance panel</h2><p class="panel-sub">Safe demo placeholder</p></div><span class="tag amber">General safety</span></div><div class="dispatch-list"><div class="dispatch-row"><div class="dispatch-icon">☎</div><div class="dispatch-copy" style="white-space:normal"><strong>Contact emergency services</strong><span style="white-space:normal">For real emergencies, call the official local emergency number immediately.</span></div></div><div class="dispatch-row"><div class="dispatch-icon">ⓘ</div><div class="dispatch-copy" style="white-space:normal"><strong>Follow professional instructions</strong><span style="white-space:normal">Do not rely on this demo for CPR, trauma care, medication or triage guidance.</span></div></div><div class="dispatch-row"><div class="dispatch-icon">⌁</div><div class="dispatch-copy" style="white-space:normal"><strong>Prepare useful details</strong><span style="white-space:normal">Share your location and observable facts with the dispatcher; only assist as directed.</span></div></div></div></section></div>`;
  }
  function analyticsView() {
    const bars=[['00',32],['04',24],['08',48],['12',62],['16',89],['20',74],['24',38]];
    const category=[['Road traffic',38],['Cardiac',25],['Medical',19],['Fall / injury',12],['Other',6]];
    return `${head('COMMAND CENTER / REPORTING','Admin command center','Review the sample fleet view, incident mix and performance indicators described in the LifeLink project report.',`<button class="btn blue" data-action="export-csv">⇩ Export incidents CSV</button>`)}${alertBox()}<div class="metric-grid">${metric('Simulated dispatches','1,248','▥','Benchmark size stated in report','blue')}${metric('Golden-hour compliance',reportMetrics.golden,'◷','Report simulation result','green')}${metric('Zero-diversion handover',reportMetrics.handover,'＋','Report simulation result','purple')}${metric('Peak-hour latency reduction',reportMetrics.latency,'↘','Report comparison result','amber')}</div><div class="section-grid"><section class="panel"><div class="panel-head"><div><h2 class="panel-title">Incident volume by time</h2><p class="panel-sub">Illustrative hourly distribution · not live telemetry</p></div><span class="tag blue">Last 24h · sample</span></div><div class="analytics-chart">${bars.map(([label,v])=>`<div class="bar-group"><b>${v}</b><div class="bar ${v>75?'red':''}" style="height:${v}%"></div><small>${label}:00</small></div>`).join('')}</div><div class="chart-legend"><span><i class="chart-dot" style="--c:#57b8ff"></i>Demo incident volume</span><span><i class="chart-dot" style="--c:#ff6e7d"></i>Peak window</span></div></section><section class="panel"><div class="panel-head"><div><h2 class="panel-title">Incident category split</h2><p class="panel-sub">Illustrative distribution</p></div><span class="tag">Demo data</span></div><div class="split-bar">${category.map((x,i)=>`<span style="width:${x[1]}%;background:${['#ff566b','#57b8ff','#22d3a6','#b79bff','#f8b84e'][i]}"></span>`).join('')}</div>${category.map((x,i)=>`<div class="category-row"><span>${x[0]}</span><div class="progress"><span style="width:${x[1]}%;background:${['#ff566b','#57b8ff','#22d3a6','#b79bff','#f8b84e'][i]}"></span></div><b>${x[1]}%</b></div>`).join('')}</section></div><div class="two-col"><section class="panel"><div class="panel-head"><div><h2 class="panel-title">Module performance evaluation</h2><p class="panel-sub">Accuracy / match success values listed in the report</p></div></div>${[['SOS & GPS',99.4],['A* routing',98.7],['Ambulance dispatch',97.9],['Hospital triage',96.8]].map(x=>`<div class="capacity-row"><span>${x[0]}</span><b>${x[1].toFixed(1)}%</b></div><div class="progress" style="margin-bottom:12px"><span style="width:${x[1]}%;background:${x[1]>98?'var(--green)':x[1]>97?'var(--blue)':'var(--purple)'}"></span></div>`).join('')}<div class="inline-note">Report figures are from a simulated benchmark, not independently verified live performance.</div></section><section class="panel"><div class="panel-head"><div><h2 class="panel-title">Fleet & hospital health</h2><p class="panel-sub">Illustrative dashboard status</p></div><span class="tag green">Demo healthy</span></div><div class="route-summary"><div class="mini-stat"><span>Active ambulances</span><strong>42</strong><small>Example fleet total</small></div><div class="mini-stat"><span>Trauma centers</span><strong>18</strong><small>Example network total</small></div><div class="mini-stat"><span>WebSocket target</span><strong>200ms</strong><small>Report requirement</small></div></div><div class="map-foot"><span>⚑ Live fleet heatmap placeholder</span><span>Local UI only</span></div>${mapSvg('overview')}</section></div>`;
  }
  function historyView() {
    const rows=state.incidents.map(it=>`<tr><td><strong>${escapeHTML(it.id)}</strong><div class="muted" style="font-size:9px;margin-top:3px">${escapeHTML(it.time)}</div></td><td>${escapeHTML(it.type)}</td><td><span class="status ${it.severity==='Critical'?'busy':it.severity==='High'?'warning':'available'}">${escapeHTML(it.severity)}</span></td><td>${escapeHTML(it.location)}</td><td>${escapeHTML(it.unit||'—')}</td><td>${escapeHTML(it.eta||'—')}</td><td>${escapeHTML(it.status)}</td></tr>`).join('');
    return `${head('AUDIT / LOCAL SESSION','Incident history','This browser session’s sample incidents and the demo flows you run. Data is not sent to a server.',`<button class="btn blue" data-action="export-csv">⇩ Export CSV</button><button class="btn" data-action="clear-history">Clear session</button>`)}${alertBox()}<div class="metric-grid">${metric('Incidents in session',String(state.incidents.length),'≡','Local browser memory','blue')}${metric('Critical priority',state.incidents.filter(i=>i.severity==='Critical').length,'⚑','Demo category count','red')}${metric('Responder assigned',state.incidents.filter(i=>i.unit).length,'✚','Sample unit links','green')}${metric('Data persistence','Session','◷','Refresh clears this prototype state','amber')}</div><section class="panel"><div class="panel-head"><div><h2 class="panel-title">Incident ledger</h2><p class="panel-sub">Locally rendered records</p></div><span class="tag">No backend</span></div><div class="table-wrap"><table><thead><tr><th>Incident / time</th><th>Category</th><th>Severity</th><th>Location</th><th>Responder</th><th>ETA</th><th>Status</th></tr></thead><tbody id="incident-table">${rows||'<tr><td colspan="7" class="blank-state">No incidents in this session.</td></tr>'}</tbody></table></div><div class="inline-note">CSV export downloads these demonstration records only. Avoid entering personal data.</div></section>`;
  }
  function render() {
    $('#breadcrumb').textContent=titles[state.view];
    $$('#side-nav [data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));
    $$('#mobile-nav [data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));
    $('#history-count').textContent=String(state.incidents.length).padStart(2,'0');
    const views={overview:overviewView,sos:sosView,routing:routingView,dispatch:dispatchView,hospital:hospitalView,analytics:analyticsView,history:historyView};
    content.innerHTML=views[state.view]();
  }
  function setStage(index, status='done') {
    const stage=$(`[data-stage="${index}"]`,content); if(!stage)return;
    stage.classList.toggle('done',status==='done');
    const badge=$('.tag',stage); if(badge){badge.textContent=status==='done'?'Complete':status==='active'?'Running':'Queued';badge.className='tag '+(status==='done'?'green':status==='active'?'blue':'');}
  }
  async function getBrowserLocation() {
    if (!navigator.geolocation) { toast('Geolocation is unavailable here. Using the report’s example coordinates.','error'); return; }
    toast('Requesting browser location permission…');
    navigator.geolocation.getCurrentPosition(pos=>{
      state.location={lat:pos.coords.latitude,lng:pos.coords.longitude,label:'Browser location captured · local only',source:'browser'};
      if(state.view==='sos')render();
      toast('Location captured in this page only. Nothing was transmitted.');
    },err=>{
      const reason=err.code===1?'Permission denied':err.code===2?'Position unavailable':'Request timed out';
      toast(`${reason}. Using the report’s example coordinates instead.`, 'error');
    },{enableHighAccuracy:true,timeout:8000,maximumAge:60000});
  }
  function resetLocation() { state.location={lat:19.2183,lng:72.9781,label:'Example coordinates · Mumbai region',source:'report sample'}; if(state.view==='sos')render(); toast('Restored the example location.'); }
  function runSOS(form) {
    if(state.running){toast('A demo SOS flow is already running.','error');return;}
    const formData=new FormData(form); const type=String(formData.get('type')||'Medical emergency'); const severity=String(formData.get('severity')||'Moderate');
    state.running=true; state.stage=0;
    $('#run-sos').disabled=true; $('#sos-progress-label').textContent='In progress';
    const allStages=$$('[data-stage]',content); allStages.forEach((_,i)=>setStage(i,'queued'));
    const labels=['Coordinates captured','Nearby units scanned','Route selected','Hospital matched','Demo dispatch confirmed'];
    const details=[`Coordinates ready: ${state.location.lat.toFixed(4)}, ${state.location.lng.toFixed(4)}.`, '4 sample units considered in the illustrative 5 km radius.','A* corridor selected: 3m 10s example ETA.','Jupiter Lifeline Hospital selected from sample inventory.','Local state updated only. No one was contacted.'];
    let i=0;
    const tick=()=>{
      if(i>0)setStage(i-1,'done');
      if(i<allStages.length){setStage(i,'active');const st=$(`[data-stage="${i}"]`,content);if(st){$('small',st).textContent=details[i];}$('#sos-progress-label').textContent=`Step ${i+1} of 5`;i++;setTimeout(tick,520);return;}
      state.running=false; const id='LL-'+String(1048+state.incidents.length-3).padStart(4,'0');
      const incident={id,type,severity,status:'Responder assigned · demo',location:state.location.source==='browser'?'Browser coordinates · local only':'Demo location · Mumbai region',time:new Date().toLocaleTimeString('en-GB',{hour12:false}),eta:'03:10',unit:'MH-04-EM-9042',hospital:'Jupiter Lifeline Hospital'};
      state.currentIncident=incident; state.incidents.unshift(incident); state.units[0].status='En route';
      $('#sos-progress-label').textContent='Complete'; $('#sos-result').innerHTML=`<div class="incident-banner"><div><strong><span class="text-green">✓</span> ${escapeHTML(id)} · ${escapeHTML(type)}</strong><small>${escapeHTML(severity)} · demo responder: MH-04-EM-9042</small></div><span class="status available">Simulated</span></div><div class="route-summary"><div class="mini-stat"><span>Sample ETA</span><strong>03:10</strong><small>Not a live estimate</small></div><div class="mini-stat"><span>Hospital match</span><strong style="font-size:12px">Jupiter Lifeline</strong><small>Sample inventory</small></div><div class="mini-stat"><span>Transmission</span><strong style="font-size:14px">None</strong><small>Client only</small></div></div><p class="inline-note">${escapeHTML(details[4])}</p><div class="form-actions"><button class="btn green" data-action="go-dispatch">View dispatch audit →</button><button class="btn" data-action="go-history">Open incident history</button></div>`;
      toast('Demo SOS flow completed. No real emergency service was contacted.');
      $('#run-sos').disabled=false; $('#history-count').textContent=String(state.incidents.length).padStart(2,'0');
    };
    tick();
  }
  function resetSOS() { state.running=false;state.stage=0;render();toast('SOS demo flow reset.'); }
  function assignUnit(id) {
    const unit=state.units.find(u=>u.id===id); if(!unit||unit.status!=='Available'){toast('That demo unit is not available.','error');return;}
    state.units.forEach(u=>{if(u.id===id)u.status='En route';});
    if(state.currentIncident){state.currentIncident.unit=id;state.currentIncident.status='Responder assigned · demo';state.currentIncident.eta=unit.eta;}
    else if(state.incidents[0]){state.incidents[0].unit=id;state.incidents[0].status='Responder assigned · demo';state.incidents[0].eta=unit.eta;state.currentIncident=state.incidents[0];}
    render();toast(`Assigned ${id} in local demo state only.`);
  }
  function reserveBed(index) { const h=state.hospitals[index]; if(!h)return; if(h.icu<1){toast(`${h.name} has no sample ICU beds available.`, 'error');return;} h.icu-=1; h.score=Math.max(50,h.score-.7); render(); toast(`Reserved one demo ICU bed at ${h.name}. No real reservation was made.`); }
  function resetHospitals() { state.hospitals=[{name:'Jupiter Lifeline Hospital',area:'Thane · Demo inventory',icu:4,icuTotal:12,ventilators:6,ventTotal:8,blood:'O+ / O−',score:96.4,status:'Good match'},{name:'Metro Trauma Centre',area:'Central zone · Demo inventory',icu:2,icuTotal:10,ventilators:3,ventTotal:6,blood:'O+ / A+',score:91.8,status:'Good match'},{name:'City General Hospital',area:'East zone · Demo inventory',icu:0,icuTotal:8,ventilators:1,ventTotal:5,blood:'A+ / B+',score:73.2,status:'Limited capacity'}];render();toast('Sample hospital inventory reset.'); }
  function exportCSV() { const rows=[['Incident ID','Category','Severity','Status','Location','Time','ETA','Responder','Hospital'],...state.incidents.map(i=>[i.id,i.type,i.severity,i.status,i.location,i.time,i.eta,i.unit||'',i.hospital||''])]; const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'); const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='lifelink-demo-incidents.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Demo incident CSV downloaded.'); }
  document.addEventListener('click', e=>{
    const nav=e.target.closest('[data-view]'); if(nav){e.preventDefault();setView(nav.dataset.view);return;}
    const btn=e.target.closest('[data-action]'); if(!btn)return; const action=btn.dataset.action;
    if(action==='go-sos')setView('sos');else if(action==='go-routing')setView('routing');else if(action==='go-dispatch')setView('dispatch');else if(action==='go-history')setView('history');
    else if(action==='get-location')getBrowserLocation();else if(action==='reset-location')resetLocation();else if(action==='reset-sos')resetSOS();
    else if(action==='recalculate-route'){toast('Demo route recalculated with the same illustrative ETA.');const el=$('.page-head p',content);if(el)el.textContent='Scenario refreshed locally. No traffic API is connected.';}
    else if(action==='assign-unit')assignUnit(btn.dataset.unit);else if(action==='refresh-units'){render();toast('Demo fleet state refreshed.');}
    else if(action==='reserve-bed')reserveBed(Number(btn.dataset.hospital));else if(action==='reset-hospitals')resetHospitals();
    else if(action==='preview-triage'){const cat=$('#triage-category')?.selectedOptions[0]?.textContent||'Selected category';const level=$('#triage-level')?.selectedOptions[0]?.textContent||'Example label';const out=$('#triage-preview');if(out)out.innerHTML=`<div class="triage-banner" style="margin:12px 0 0"><div class="triage-mark">i</div><div><strong>Demo selection saved locally</strong><p>${escapeHTML(cat)} · ${escapeHTML(level)}. This is not a diagnosis, a triage recommendation or medical advice.</p></div></div>`;}
    else if(action==='export-csv')exportCSV();else if(action==='clear-history'){if(confirm('Clear the demo incident list from this browser session?')){state.incidents=[];state.currentIncident=null;render();toast('Local session incident list cleared.');}}
  });
  document.addEventListener('submit',e=>{if(e.target.id==='sos-form'){e.preventDefault();runSOS(e.target);}});
  function tickClock(){const now=new Date();$('#clock').textContent=now.toLocaleTimeString('en-IN',{hour12:false,timeZone:'Asia/Kolkata'})+' IST';}
  tickClock();setInterval(tickClock,1000);render();
})();
</script>
